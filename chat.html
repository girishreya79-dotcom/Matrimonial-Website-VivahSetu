<!DOCTYPE html> 
<html> 
<head> 
<title>Message Your Partner</title> 

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"> 

<style>
body{
    background: linear-gradient(135deg, #667eea, #764ba2);
    font-family: 'Poppins', sans-serif;
}

.message-card{
    width: 420px;
    border-radius: 16px;
    box-shadow: 0 12px 25px rgba(0,0,0,0.15);
    background: #fff;
    padding: 30px;
    transition: transform 0.3s, box-shadow 0.3s;
}
.message-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 30px rgba(0,0,0,0.25);
}

.message-card h5{
    font-weight: 600;
    color: #4e73df;
    letter-spacing: 0.5px;
}

.form-control{
    border-radius: 10px;
    font-size: 14px;
    padding: 10px 15px;
    border: 1px solid #ced4da;
    transition: 0.3s;
}
.form-control:focus{
    border-color: #4e73df;
    box-shadow: 0 0 8px rgba(78,115,223,0.3);
}

.btn-custom{
    border-radius: 12px;
    font-weight: 500;
    background: linear-gradient(135deg, #4e73df, #6c5ce7);
    border: none;
    transition: 0.3s;
}
.btn-custom:hover{
    background: linear-gradient(135deg, #3b5bdb, #4834d4);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.form-label {
    font-size: 13px;
    font-weight: 500;
    color: #555;
}

textarea.form-control {
    resize: none;
}

</style>

</head> 
<body> 

<div class="d-flex justify-content-center align-items-center vh-100">

    <div class="card message-card">

        <h5 class="text-center mb-4">💌 Send Message</h5>

        <form action="chat.php" method="post">

            <div class="mb-3"> 
                <label class="form-label">Sender Email</label> 
                <input type="email" name="nm1" class="form-control" placeholder="Enter your email" required> 
            </div> 

            <div class="mb-3"> 
                <label class="form-label">Receiver Email</label> 
                <input type="email" name="nm2" class="form-control" placeholder="Enter partner email" required> 
            </div>

            <div class="mb-3"> 
                <label class="form-label">Subject</label> 
                <input type="text" name="nm3" class="form-control" placeholder="Subject of the message" required> 
            </div> 

            <div class="mb-3"> 
                <label class="form-label">Date</label> 
                <input type="date" name="nm4" class="form-control" required>
            </div>

            <div class="mb-4"> 
                <label class="form-label">Message</label> 
                <textarea name="nm5" class="form-control" rows="4" placeholder="Type your message here..." required></textarea> 
            </div>

            <div class="d-grid">
                <input type="submit" value="Send Message" class="btn btn-custom btn-sm">
            </div>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script> 

</body> 
</html>
