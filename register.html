    <!-- Registration Form -->
    <form action="register.php" method="post" enctype="multipart/form-data">

        <div class="container mt-5 mb-5">
            <div class="row justify-content-center">
                <div class="col-md-8">

                    <div class="card shadow-lg p-4 rounded-4">
                        <h3 class="text-center text-danger mb-4">
                            <i>Basic Personal Information</i>
                        </h3>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" name="nm1" class="form-control" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" name="nm2" class="form-control" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" name="nm3" class="form-control" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Age</label>
                                <input type="text" name="nm4" class="form-control" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Contact Number</label>
                                <input type="text" name="nm5" class="form-control" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">City</label>
                                <input type="text" name="nm7" class="form-control" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">State</label>
                                <input type="text" name="nm8" class="form-control" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">DOB</label>
                                <input type="date" name="nm10" class="form-control" required>
                            </div>

                            <div class="col-12 mb-3">
                                <label class="form-label">Address</label>
                                <input type="text" name="nm6" class="form-control" required>
                            </div>

                            <div class="col-12 mb-3">
                                <label class="form-label d-block">Gender</label>

                                <div class="form-check form-check-inline">
                                    <input type="radio" name="nm9" class="form-check-input" value="Male">
                                    <label class="form-check-label">Male</label>
                                </div>

                                <div class="form-check form-check-inline">
                                    <input type="radio" name="nm9" class="form-check-input" value="Female">

                            </div>

                        </div>
